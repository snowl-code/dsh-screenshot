# ============================================================================
# dsh-screenshot 的 bundle patch —— 把截图插件挂进 DSH 配置树
# ============================================================================
#
# insert 往配置树里加一行 entry：
#   - id: 行标识（patch 覆盖按它定位），必须全局唯一，建议与包名一致
#   - name: 插件模块名，解析到 package.json 的 main（宿主半侧 lib/index.js）
#
# 注意：id 那一行绝对不能写行尾注释（商城预检按行抓值）。
# package.json 里的 dsh.client 声明让模块系统同时把本包当作浏览器插件，
# 页面侧入口由 exports["./client"] 指向 lib/client.js。
# ============================================================================

- insert:
    - id: dsh-screenshot
      name: 'dsh-screenshot'
