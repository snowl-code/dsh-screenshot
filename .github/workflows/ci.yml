name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check test/client-smoke.mjs
          node --check test/keycodes-smoke.mjs
      - name: Smoke test (client + key mapping, no DSH required)
        run: npm test

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile-check Windows helpers (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File bin/win/hotkey.ps1 -Vk 83 -Mods 3 -Check
          powershell -NoProfile -ExecutionPolicy Bypass -File bin/win/capture.ps1 -Out "$env:TEMP\probe.jpg" -Check
      - name: Warm capture agent reaches READY
        shell: powershell
        run: |
          $output = '' | powershell -NoProfile -ExecutionPolicy Bypass -STA -File bin/win/capture-agent.ps1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "capture-agent exited with $LASTEXITCODE" }
          if (-not ($output -match 'READY')) { throw 'capture-agent did not report READY' }
      - name: Smoke test on Windows
        run: npm test
